[project]
name = "govee-fx"
version = "0.1.0"
description = "Design custom animations for Govee curtain lights"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
govee_fx = "govee_fx.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["govee_fx"]
